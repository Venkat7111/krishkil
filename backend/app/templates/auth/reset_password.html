{% extends "layouts/auth.html" %}
{% block title %}Reset Password · KrishiSahay{% endblock %}
{% block content %}
<h2 class="font-display text-2xl font-semibold mb-1">Set new password</h2>
<p class="text-sm muted mb-6">Choose a strong password for your account.</p>
<form id="reset-form" class="space-y-4">
  <div class="field">
    <label>New Password</label>
    <input class="field-input" type="password" name="newPassword" required minlength="6" />
  </div>
  <div class="field">
    <label>Confirm Password</label>
    <input class="field-input" type="password" name="confirmPassword" required minlength="6" />
  </div>
  <button type="submit" class="btn btn-primary btn-full">Update Password</button>
</form>
{% endblock %}
