{% extends "layouts/auth.html" %}
{% block title %}Login · KrishiSahay{% endblock %}
{% block content %}
<h2 class="font-display text-2xl font-semibold mb-1" data-i18n="auth.loginTitle">Welcome back</h2>
<p class="text-sm muted mb-6" data-i18n="auth.loginSubtitle">Log in to continue growing smarter.</p>
<form id="login-form" class="space-y-4">
  <div class="field">
    <label data-i18n="auth.email">Email</label>
    <input class="field-input" type="email" name="email" placeholder="you@example.com" required />
  </div>
  <div class="field">
    <label data-i18n="auth.password">Password</label>
    <input class="field-input" type="password" name="password" placeholder="••••••••" required minlength="6" />
  </div>
  <div class="flex items-center justify-between text-sm">
    <label class="flex items-center gap-2 muted">
      <input type="checkbox" name="remember" /> <span data-i18n="auth.remember">Remember me</span>
    </label>
    <a href="/forgot-password" class="text-primary" data-i18n="auth.forgot">Forgot password?</a>
  </div>
  <p id="login-error" class="text-sm text-red"></p>
  <button type="submit" class="btn btn-primary btn-full">Login</button>
  <button type="button" id="guest-btn" class="btn btn-ghost btn-full" data-i18n="welcome.guest">Continue as Guest</button>
</form>
<p class="text-sm text-center muted mt-6">
  <span data-i18n="auth.noAccount">Don't have an account?</span>
  <a href="/register" class="text-primary font-medium">Register</a>
</p>
{% endblock %}
