{% extends "layouts/auth.html" %}
{% block title %}Forgot Password · KrishiSahay{% endblock %}
{% block content %}
<h2 class="font-display text-2xl font-semibold mb-1">Forgot password?</h2>
<p class="text-sm muted mb-6">Enter your email and we'll send a one-time code.</p>
<form id="forgot-form" class="space-y-4">
  <div class="field">
    <label>Email</label>
    <input class="field-input" type="email" name="email" required />
  </div>
  <button type="submit" class="btn btn-primary btn-full">Send OTP</button>
</form>
<p class="text-sm text-center muted mt-6"><a href="/login" class="text-primary">Back to login</a></p>
{% endblock %}
